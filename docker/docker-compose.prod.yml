name: alpargotobot-prod

services:
  telegram-bot:
    image: ${DOCKER_IMAGE:-ghcr.io/alpargatagazer/alpargotobot:latest}
    container_name: alpargotobot_prod
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    environment:
      - TZ=Europe/Madrid
      - SCHEDULE_TIME=08:00
      - LOGGING=INFO
      - RUN_ON_STARTUP=false
      - NAVIDROME_API_VERSION=1.16.1
      - NAVIDROME_MUSIC_FOLDER=Music Library
      - DATA_DIR=/app/data
    volumes:
      - ../data:/app/data
    depends_on:
      init-chown:
        condition: service_completed_successfully
    secrets:
      - navidrome_url
      - navidrome_user
      - navidrome_password
      - telegram_token
      - telegram_chat_ids
      - credentials_encryption_key

  init-chown:
    image: alpine:latest
    container_name: alpargotobot_prod_init
    command: >
      sh -c "chown -R ${UID:-1000}:${GID:-1000} /data"
    volumes:
      - ../data:/data
    restart: "no"

secrets:
  navidrome_url:
    file: ../secrets/navidrome_url.txt
  navidrome_user:
    file: ../secrets/navidrome_user.txt
  navidrome_password:
    file: ../secrets/navidrome_password.txt
  telegram_token:
    file: ../secrets/telegram_bot_token.txt
  telegram_chat_ids:
    file: ../secrets/telegram_chat_id.txt
  credentials_encryption_key:
    file: ../secrets/credentials_encryption_key.txt
