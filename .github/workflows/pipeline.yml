name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Makefile'
      - 'LICENSE'
      - 'README.md'
      - '.mise.toml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'Makefile'
      - 'LICENSE'
      - 'README.md'
      - '.mise.toml'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_TAG: local-bot:latest

jobs:
  test:
    name: Go Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1

  build:
    name: Build & Save Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.versioning.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load external environment variables
        run: cat .env.versions >> $GITHUB_ENV

      - name: Determine Version Bump
        id: versioning
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"
          
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MSG" == *"#major"* ]]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            NEW_VERSION="v$major.$minor.$patch"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Determined new version: $NEW_VERSION"
          else
            # For PRs or other events, keep the latest tag or fallback
            echo "new_version=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Keeping current version: $LATEST_TAG"
          fi

      - name: Build local production image
        run: |
          docker build \
            --build-arg GO_VERSION=${GO_IMAGE_VERSION} \
            --build-arg ALPINE_VERSION=${ALPINE_IMAGE_VERSION} \
            -t ${{ env.LOCAL_TAG }} \
            -f docker/Dockerfile.prod .

      - name: Save image as artifact
        run: docker save ${{ env.LOCAL_TAG }} | gzip > image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz

  trivy:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < image.tar.gz

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          trivy-config: trivy.yaml

  push-registry:
    name: Publish to Registry
    needs: [build, trivy]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load local image
        run: docker load < image.tar.gz

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push
        run: |
          IMG=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${{ needs.build.outputs.new_version }}
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TAG="pr-${{ github.event.number }}"
            docker tag ${{ env.LOCAL_TAG }} $IMG:$TAG
            docker push $IMG:$TAG
          else
            # MAIN: Publish with version, latest and SHA
            docker tag ${{ env.LOCAL_TAG }} $IMG:$VERSION
            docker tag ${{ env.LOCAL_TAG }} $IMG:latest
            docker tag ${{ env.LOCAL_TAG }} $IMG:${{ github.sha }}
            docker push $IMG:$VERSION
            docker push $IMG:latest
            docker push $IMG:${{ github.sha }}
          fi

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, push-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.build.outputs.new_version }}
          name: Release ${{ needs.build.outputs.new_version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
